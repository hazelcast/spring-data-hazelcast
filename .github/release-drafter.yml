name-template: v$NEXT_PATCH_VERSION
tag-template: v$NEXT_PATCH_VERSION
template: |
  ## What’s Changed

  $CHANGES

  ## Contributors
  $CONTRIBUTORS

  Special thanks to all contributors! 👏
  
categories:
  - title: Features & Enhancements
    labels:
      - 'feature'
      - 'enhancement'
  - title: Fixes
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: Dependencies
    label: dependencies
  - title: Documentation
    label: documentation
    
exclude-labels:
  - 'internal'
